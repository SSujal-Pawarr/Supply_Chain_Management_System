<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supply Chain | Warehouses</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/index.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="bg-overlay"></div>
  <div id="scroll-spacer"></div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="logo-container">
        <div class="logo-icon">SC</div>
        <div class="logo-text">SupplyChain</div>
      </div>
      <div class="nav-section-label">Overview</div>
      <nav><ul class="nav-links">
        <li><a href="dashboard.html" class="nav-item"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
      </ul></nav>
      <div class="nav-section-label">Entities</div>
      <nav><ul class="nav-links">
        <li><a href="customers.html" class="nav-item"><i class='bx bx-user-circle'></i> Customers</a></li>
        <li><a href="suppliers.html" class="nav-item"><i class='bx bx-store-alt'></i> Suppliers</a></li>
        <li><a href="products.html" class="nav-item"><i class='bx bx-box'></i> Products</a></li>
        <li><a href="warehouses.html" class="nav-item active"><i class='bx bx-buildings'></i> Warehouses</a></li>
      </ul></nav>
      <div class="nav-section-label">Operations</div>
      <nav><ul class="nav-links">
        <li><a href="orders.html" class="nav-item"><i class='bx bx-cart'></i> Orders</a></li>
        <li><a href="inventory.html" class="nav-item"><i class='bx bx-layer'></i> Inventory</a></li>
      </ul></nav>
      <div class="sidebar-footer">
        <button class="btn-secondary" style="width:100%;font-size:11px;padding:7px;" onclick="window.supplyChainAPI.logout()">
          <i class='bx bx-log-out'></i> Sign Out
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header animate-fade-in">
        <div>
          <h1 class="page-title">Warehouses</h1>
          <p class="page-subtitle">Track locations, managers and storage capacities</p>
        </div>
        <button class="btn-primary" onclick="openAddModal()"><i class='bx bx-plus'></i> Add Warehouse</button>
      </header>

      <!-- Summary Cards -->
      <div class="dashboard-grid" id="warehouse-cards"></div>

      <!-- Table -->
      <div class="content-section animate-fade-in delay-2">
        <div class="glass-panel data-table-container margin-top-2">
          <table class="data-table">
            <thead><tr>
              <th>ID</th><th>Location</th><th>Manager</th><th>Capacity</th><th>Actions</th>
            </tr></thead>
            <tbody id="warehouses-table-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <dialog id="add-modal">
    <div class="modal-title" id="modal-title">Add Warehouse</div>
    <form onsubmit="submitForm(event)">
      <input type="hidden" id="edit-id"/>
      <div class="form-group">
        <label>Location *</label>
        <input type="text" name="location" required placeholder="Mumbai Warehouse A"/>
      </div>
      <div class="form-group">
        <label>Capacity (units)</label>
        <input type="number" name="capacity" min="0" placeholder="5000"/>
      </div>
      <div class="form-group">
        <label>Warehouse Manager</label>
        <input type="text" name="warehouse_manager" placeholder="Manager Name"/>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary">Save Warehouse</button>
      </div>
    </form>
  </dialog>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/app.js"></script>
  <script src="js/scroll-animation.js"></script>
  <script>
    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Warehouse';
      document.getElementById('edit-id').value = '';
      document.querySelector('#add-modal form').reset();
      document.getElementById('add-modal').showModal();
    }
    function closeModal() { document.getElementById('add-modal').close(); }

    function openEditModal(w) {
      document.getElementById('modal-title').textContent = 'Edit Warehouse';
      document.getElementById('edit-id').value = w.warehouse_id;
      document.querySelector('[name="location"]').value = w.location || '';
      document.querySelector('[name="capacity"]').value = w.capacity || '';
      document.querySelector('[name="warehouse_manager"]').value = w.warehouse_manager || '';
      document.getElementById('add-modal').showModal();
    }

    async function submitForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = {
        location: fd.get('location'),
        capacity: fd.get('capacity') ? parseInt(fd.get('capacity')) : null,
        warehouse_manager: fd.get('warehouse_manager') || null
      };
      const editId = document.getElementById('edit-id').value;
      const result = editId
        ? await window.supplyChainAPI.updateWarehouse(editId, data)
        : await window.supplyChainAPI.createWarehouse(data);

      if (result) {
        closeModal();
        toast(editId ? 'Warehouse updated!' : 'Warehouse added!', 'success');
        loadWarehouses();
      } else {
        toast('Operation failed.', 'error');
      }
    }

    window.executeDeleteWarehouse = async function(id) {
      if (!confirm('Delete this warehouse? Inventory records linked to it may be affected.')) return;
      const ok = await window.supplyChainAPI.deleteWarehouse(id);
      if (ok) { toast('Warehouse deleted.', 'success'); loadWarehouses(); }
      else toast('Delete failed.', 'error');
    };

    async function loadWarehouses() {
      const tbody = document.getElementById('warehouses-table-body');
      const grid  = document.getElementById('warehouse-cards');
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-secondary);">Loading...</td></tr>`;

      const data = await window.supplyChainAPI.getWarehouses();
      if (!data || !data.length) {
        tbody.innerHTML = window.supplyChainAPI.getEmptyStateHTML(5, 'No warehouses found.');
        grid.innerHTML = '';
        return;
      }

      // Summary cards
      grid.innerHTML = data.map((w, i) => `
        <div class="stat-card glass-panel ${['green','cyan','orange','blue'][i%4]} animate-fade-in delay-${(i%4)+1}">
          <div class="stat-header">
            <span>${w.location}</span>
            <i class='bx bx-building-house' style="font-size:20px;color:var(--accent-tertiary)"></i>
          </div>
          <div class="stat-value">${(w.capacity||0).toLocaleString()}</div>
          <div class="text-muted">Managed by ${w.warehouse_manager||'—'}</div>
        </div>`).join('');

      // Table rows
      tbody.innerHTML = data.map((w, i) => `
        <tr class="animate-fade-in delay-${(i%4)+1}">
          <td class="text-muted">${w.warehouse_id}</td>
          <td style="font-weight:500"><i class='bx bx-map-pin' style="color:var(--accent-tertiary);margin-right:5px;"></i>${w.location}</td>
          <td>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;">
                <i class='bx bx-user' style="font-size:13px;color:var(--accent-tertiary)"></i>
              </div>
              <span>${w.warehouse_manager||'—'}</span>
            </div>
          </td>
          <td>${w.capacity!=null ? w.capacity.toLocaleString()+' units' : '—'}</td>
          <td><div class="actions-cell">
            <a href="inventory.html" class="btn-icon" title="View Inventory"><i class='bx bx-layer'></i></a>
            <button class="btn-icon" title="Edit" onclick='openEditModal(${JSON.stringify(w).replace(/'/g,"&#39;")})'><i class='bx bx-edit'></i></button>
            <button class="btn-danger" onclick="executeDeleteWarehouse(${w.warehouse_id})"><i class='bx bx-trash'></i></button>
          </div></td>
        </tr>`).join('');
    }

    function toast(msg, type='success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<i class='bx ${type==='success'?'bx-check-circle':'bx-error-circle'}'></i> ${msg}`;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    document.addEventListener('DOMContentLoaded', loadWarehouses);
  </script>
</body>
</html>
