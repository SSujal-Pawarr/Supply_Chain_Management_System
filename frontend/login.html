<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supply Chain | Sign In</title>
  <link rel="stylesheet" href="css/index.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background: var(--bg-darker); font-family: var(--font-display); }
    .login-card {
      background: #1a1d2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 48px;
      width: 420px;
      max-width: 95vw;
      box-shadow: 0 8px 48px rgba(0,0,0,0.4);
      animation: fadeIn 0.5s ease;
    }
    .login-logo { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--accent-primary); letter-spacing: -0.5px; }
    .login-sub { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); margin-top: 4px; margin-bottom: 36px; font-weight: 500; }
    .login-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; margin-bottom: 28px; }
    .auth-error { color: var(--accent-danger); font-size: 12px; margin-top: 12px; display:none; }
    .login-btn { width: 100%; padding: 13px; margin-top: 8px; font-size: 14px; letter-spacing: 0; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">⬡ CHAIN</div>
    <div class="login-sub">Supply Chain Management Portal</div>
    <div class="login-title">Sign In</div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="auth-email" class="form-control" placeholder="admin@company.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="auth-password" class="form-control" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') handleLogin()"/>
    </div>
    <button class="btn-primary login-btn" onclick="handleLogin()">
      <i class='bx bx-log-in'></i> Sign In
    </button>
    <div class="auth-error" id="auth-error">
      <i class='bx bx-error-circle'></i> Invalid credentials. Please try again.
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    async function handleLogin() {
      const email  = document.getElementById('auth-email').value.trim();
      const pw     = document.getElementById('auth-password').value;
      const errEl  = document.getElementById('auth-error');
      const btn    = document.querySelector('.login-btn');

      errEl.style.display = 'none';

      if (!email || !pw) {
        errEl.style.display = 'block';
        errEl.innerHTML = '<i class="bx bx-error-circle"></i> Please fill in all fields.';
        return;
      }

      // Show loading state
      btn.disabled = true;
      btn.innerHTML = '<i class="bx bx-loader-alt bx-spin"></i> Signing in…';

      const result = await window.supplyChainAPI.login(email, pw);

      btn.disabled = false;
      btn.innerHTML = '<i class="bx bx-log-in"></i> Sign In';

      if (result && result.token) {
        window.location.replace('dashboard.html');
      } else {
        errEl.style.display = 'block';
        errEl.innerHTML = '<i class="bx bx-error-circle"></i> Invalid credentials. Please try again.';
      }
    }
  </script>
</body>
</html>
