<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supply Chain | Suppliers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/index.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="bg-overlay"></div>
  <div id="scroll-spacer"></div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="logo-container">
        <div class="logo-icon">SC</div>
        <div class="logo-text">SupplyChain</div>
      </div>
      <div class="nav-section-label">Overview</div>
      <nav><ul class="nav-links">
        <li><a href="dashboard.html" class="nav-item"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
      </ul></nav>
      <div class="nav-section-label">Entities</div>
      <nav><ul class="nav-links">
        <li><a href="customers.html" class="nav-item"><i class='bx bx-user-circle'></i> Customers</a></li>
        <li><a href="suppliers.html" class="nav-item active"><i class='bx bx-store-alt'></i> Suppliers</a></li>
        <li><a href="products.html" class="nav-item"><i class='bx bx-box'></i> Products</a></li>
        <li><a href="warehouses.html" class="nav-item"><i class='bx bx-buildings'></i> Warehouses</a></li>
      </ul></nav>
      <div class="nav-section-label">Operations</div>
      <nav><ul class="nav-links">
        <li><a href="orders.html" class="nav-item"><i class='bx bx-cart'></i> Orders</a></li>
        <li><a href="inventory.html" class="nav-item"><i class='bx bx-layer'></i> Inventory</a></li>
      </ul></nav>
      <div class="sidebar-footer">
        <button class="btn-secondary" style="width:100%;font-size:11px;padding:7px;" onclick="window.supplyChainAPI.logout()">
          <i class='bx bx-log-out'></i> Sign Out
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header animate-fade-in">
        <div>
          <h1 class="page-title">Suppliers</h1>
          <p class="page-subtitle">Manage supplier profiles and contact information</p>
        </div>
        <button class="btn-primary" style="background:var(--accent-secondary);color:#000" onclick="openAddModal()">
          <i class='bx bx-plus'></i> Add Supplier
        </button>
      </header>

      <div class="content-section animate-fade-in delay-1">
        <div class="glass-panel">
          <div class="filter-bar">
            <input class="search-input" placeholder="🔍  Search by name, email or city..." oninput="filterRows(this.value)"/>
          </div>
          <div class="data-table-container">
            <table class="data-table">
              <thead><tr>
                <th>ID</th><th>Name</th><th>City</th><th>Email</th><th>Phone</th><th>Actions</th>
              </tr></thead>
              <tbody id="suppliers-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <dialog id="add-modal">
    <div class="modal-title" id="modal-title">Add Supplier</div>
    <form onsubmit="submitForm(event)">
      <input type="hidden" id="edit-id"/>
      <div class="form-group">
        <label>Supplier Name *</label>
        <input type="text" name="name" required placeholder="Globex Industries"/>
      </div>
      <div class="form-group">
        <label>City *</label>
        <input type="text" name="city" required placeholder="Mumbai"/>
      </div>
      <div class="form-group">
        <label>Contact Email</label>
        <input type="email" name="contact_email" placeholder="contact@globex.com"/>
      </div>
      <div class="form-group">
        <label>Phone (10 digits)</label>
        <input type="tel" name="phone" maxlength="10" placeholder="9876543210"/>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary" style="background:var(--accent-secondary);color:#000">Save Supplier</button>
      </div>
    </form>
  </dialog>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/app.js"></script>
  <script src="js/scroll-animation.js"></script>
  <script>
    let allSuppliers = [];

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Supplier';
      document.getElementById('edit-id').value = '';
      document.querySelector('#add-modal form').reset();
      document.getElementById('add-modal').showModal();
    }
    function closeModal() { document.getElementById('add-modal').close(); }

    function openEditModal(s) {
      document.getElementById('modal-title').textContent = 'Edit Supplier';
      document.getElementById('edit-id').value = s.supplier_id;
      document.querySelector('[name="name"]').value = s.name || '';
      document.querySelector('[name="city"]').value = s.city || '';
      document.querySelector('[name="contact_email"]').value = s.contact_email || '';
      document.querySelector('[name="phone"]').value = s.phone || '';
      document.getElementById('add-modal').showModal();
    }

    async function submitForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      if (!data.contact_email) delete data.contact_email;
      if (!data.phone) delete data.phone;

      const editId = document.getElementById('edit-id').value;
      const result = editId
        ? await window.supplyChainAPI.updateSupplier(editId, data)
        : await window.supplyChainAPI.createSupplier(data);

      if (result) {
        closeModal();
        toast(editId ? 'Supplier updated!' : 'Supplier added!', 'success');
        loadSuppliers();
      } else {
        toast('Operation failed.', 'error');
      }
    }

    window.executeDeleteSupplier = async function(id) {
      if (!confirm('Delete this supplier? This may affect linked products.')) return;
      const ok = await window.supplyChainAPI.deleteSupplier(id);
      if (ok) { toast('Supplier deleted.', 'success'); loadSuppliers(); }
      else toast('Delete failed.', 'error');
    };

    function filterRows(q) {
      const lq = q.toLowerCase();
      document.querySelectorAll('#suppliers-table-body tr[data-row]').forEach(row => {
        row.style.display = row.dataset.search.includes(lq) ? '' : 'none';
      });
    }

    async function loadSuppliers() {
      const tbody = document.getElementById('suppliers-table-body');
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-secondary);">Loading...</td></tr>`;
      const data = await window.supplyChainAPI.getSuppliers();
      allSuppliers = data || [];

      if (!allSuppliers.length) {
        tbody.innerHTML = window.supplyChainAPI.getEmptyStateHTML(6, 'No suppliers found.');
        return;
      }
      tbody.innerHTML = allSuppliers.map((s, i) => `
        <tr data-row="${s.supplier_id}" data-search="${[s.name,s.contact_email,s.city,s.phone].join(' ').toLowerCase()}" class="animate-fade-in delay-${(i%4)+1}">
          <td class="text-muted">${s.supplier_id}</td>
          <td style="font-weight:500">${s.name}</td>
          <td><i class='bx bx-current-location' style="color:var(--accent-secondary);margin-right:4px;"></i>${s.city}</td>
          <td><a href="mailto:${s.contact_email||''}" style="color:var(--accent-primary);text-decoration:none;">${s.contact_email||'—'}</a></td>
          <td class="text-muted">${s.phone||'—'}</td>
          <td><div class="actions-cell">
            <button class="btn-icon" title="Edit" onclick='openEditModal(${JSON.stringify(s).replace(/'/g,"&#39;")})'><i class='bx bx-edit'></i></button>
            <button class="btn-danger" onclick="executeDeleteSupplier(${s.supplier_id})"><i class='bx bx-trash'></i></button>
          </div></td>
        </tr>`).join('');
    }

    function toast(msg, type='success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<i class='bx ${type==='success'?'bx-check-circle':'bx-error-circle'}'></i> ${msg}`;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    document.addEventListener('DOMContentLoaded', loadSuppliers);
  </script>
</body>
</html>
