<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supply Chain | Customers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/index.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    dialog { width: 480px; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="bg-overlay"></div>
  <div id="scroll-spacer"></div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="logo-container">
        <div class="logo-icon">SC</div>
        <div class="logo-text">SupplyChain</div>
      </div>
      <div class="nav-section-label">Overview</div>
      <nav><ul class="nav-links">
        <li><a href="dashboard.html" class="nav-item"><i class='bx bxs-dashboard'></i> Dashboard</a></li>
      </ul></nav>
      <div class="nav-section-label">Entities</div>
      <nav><ul class="nav-links">
        <li><a href="customers.html" class="nav-item active"><i class='bx bx-user-circle'></i> Customers</a></li>
        <li><a href="suppliers.html" class="nav-item"><i class='bx bx-store-alt'></i> Suppliers</a></li>
        <li><a href="products.html" class="nav-item"><i class='bx bx-box'></i> Products</a></li>
        <li><a href="warehouses.html" class="nav-item"><i class='bx bx-buildings'></i> Warehouses</a></li>
      </ul></nav>
      <div class="nav-section-label">Operations</div>
      <nav><ul class="nav-links">
        <li><a href="orders.html" class="nav-item"><i class='bx bx-cart'></i> Orders</a></li>
        <li><a href="inventory.html" class="nav-item"><i class='bx bx-layer'></i> Inventory</a></li>
      </ul></nav>
      <div class="sidebar-footer">
        <button class="btn-secondary" style="width:100%;font-size:11px;padding:7px;" onclick="window.supplyChainAPI.logout()">
          <i class='bx bx-log-out'></i> Sign Out
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header animate-fade-in">
        <div>
          <h1 class="page-title">Customers</h1>
          <p class="page-subtitle">Manage customer profiles and shipping addresses</p>
        </div>
        <button class="btn-primary" onclick="openAddModal()"><i class='bx bx-plus'></i> Add Customer</button>
      </header>

      <div class="content-section animate-fade-in delay-1">
        <div class="glass-panel">
          <div class="filter-bar">
            <input class="search-input" id="search-input" placeholder="🔍  Search by name, phone or address..." oninput="filterRows(this.value)"/>
          </div>
          <div class="data-table-container">
            <table class="data-table">
              <thead><tr>
                <th>ID</th><th>Name</th><th>Phone</th><th>Shipping Address</th><th>Actions</th>
              </tr></thead>
              <tbody id="customers-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <dialog id="add-modal">
    <div class="modal-title" id="modal-title">Add Customer</div>
    <form onsubmit="submitForm(event)">
      <input type="hidden" id="edit-id"/>
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" required placeholder="John Doe"/>
      </div>
      <div class="form-group">
        <label>Phone (10 digits)</label>
        <input type="tel" name="phone" maxlength="10" placeholder="9876543210"/>
      </div>
      <div class="form-group">
        <label>Shipping Address *</label>
        <input type="text" name="shipping_address" required placeholder="123 Main St, Mumbai"/>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary">Save Customer</button>
      </div>
    </form>
  </dialog>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/app.js"></script>
  <script src="js/scroll-animation.js"></script>
  <script>
    let allCustomers = [];

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Customer';
      document.getElementById('edit-id').value = '';
      document.querySelector('#add-modal form').reset();
      document.getElementById('add-modal').showModal();
    }
    function closeModal() { document.getElementById('add-modal').close(); }

    function openEditModal(c) {
      document.getElementById('modal-title').textContent = 'Edit Customer';
      document.getElementById('edit-id').value = c.customer_id;
      document.querySelector('[name="name"]').value = c.name || '';
      document.querySelector('[name="phone"]').value = c.phone || '';
      document.querySelector('[name="shipping_address"]').value = c.shipping_address || '';
      document.getElementById('add-modal').showModal();
    }

    async function submitForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      // Remove empty phone
      if (!data.phone) delete data.phone;

      const editId = document.getElementById('edit-id').value;
      let result;
      if (editId) {
        result = await window.supplyChainAPI.updateCustomer(editId, data);
      } else {
        result = await window.supplyChainAPI.createCustomer(data);
      }
      if (result) {
        closeModal();
        toast(editId ? 'Customer updated!' : 'Customer added!', 'success');
        loadCustomers();
      } else {
        toast('Operation failed. Check console.', 'error');
      }
    }

    window.executeDelete = async function(id) {
      if (!confirm('Delete this customer? This cannot be undone.')) return;
      const ok = await window.supplyChainAPI.deleteCustomer(id);
      if (ok) { toast('Customer deleted.', 'success'); loadCustomers(); }
      else toast('Delete failed.', 'error');
    };

    function filterRows(q) {
      const lq = q.toLowerCase();
      document.querySelectorAll('#customers-table-body tr[data-row]').forEach(row => {
        row.style.display = row.dataset.search.includes(lq) ? '' : 'none';
      });
    }

    async function loadCustomers() {
      const tbody = document.getElementById('customers-table-body');
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-secondary);">Loading...</td></tr>`;
      const data = await window.supplyChainAPI.getCustomers();
      allCustomers = data || [];

      if (!allCustomers.length) {
        tbody.innerHTML = window.supplyChainAPI.getEmptyStateHTML(5, 'No customers found.');
        return;
      }
      tbody.innerHTML = allCustomers.map((c, i) => `
        <tr data-row="${c.customer_id}" data-search="${[c.name,c.phone,c.shipping_address].join(' ').toLowerCase()}" class="animate-fade-in delay-${(i%4)+1}">
          <td class="text-muted">${c.customer_id}</td>
          <td style="font-weight:500">${c.name}</td>
          <td class="text-muted">${c.phone || '—'}</td>
          <td>${c.shipping_address}</td>
          <td><div class="actions-cell">
            <button class="btn-icon" title="Edit" onclick='openEditModal(${JSON.stringify(c).replace(/'/g,"&#39;")})'><i class='bx bx-edit'></i></button>
            <button class="btn-danger" onclick="executeDelete(${c.customer_id})"><i class='bx bx-trash'></i></button>
          </div></td>
        </tr>`).join('');
    }

    function toast(msg, type='success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<i class='bx ${type==='success'?'bx-check-circle':'bx-error-circle'}'></i> ${msg}`;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    document.addEventListener('DOMContentLoaded', loadCustomers);
  </script>
</body>
</html>
